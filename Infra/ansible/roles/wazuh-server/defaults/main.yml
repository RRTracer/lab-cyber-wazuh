---
# Version de la branche Wazuh utilisée
wazuh_version: "4.14"

# Adresse du serveur
wazuh_server_ip: "192.168.56.10"

# URL de téléchargement de l'assistant officiel
wazuh_installer_url: "https://packages.wazuh.com/{{ wazuh_version }}/wazuh-install.sh"

# Emplacement de l'installation
wazuh_install_dir: "/var/tmp/wazuh-install"

# Paquets attendus après installation
wazuh_server_packages:
  - wazuh-manager
  - wazuh-indexer
  - wazuh-dashboard

# Services systemd
wazuh_server_services:
  - wazuh-manager
  - wazuh-indexer
  - wazuh-dashboard
