---
wazuh_manager_group: wazuh_server
wazuh_manager_ip: "192.168.56.10"

wazuh_agent_name: "{{ inventory_hostname }}"
wazuh_agent_group: "default"

wazuh_agent_repository_key_url: "https://packages.wazuh.com/key/GPG-KEY-WAZUH"
wazuh_agent_repository_key_tmp: "/tmp/GPG-KEY-WAZUH"
wazuh_agent_repository_keyring: "/usr/share/keyrings/wazuh.gpg"

wazuh_agent_repository_file: "/etc/apt/sources.list.d/wazuh.list"
wazuh_agent_repository: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"

wazuh_agent_service: wazuh-agent