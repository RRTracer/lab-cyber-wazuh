---
all:
  children:
    wazuh_server:
      hosts:
        wazuh-01:
          ansible_host: 192.168.56.10
          ansible_user: vagrant
          ansible_ssh_private_key_file: ../../.vagrant/machines/wazuh/virtualbox/private_key

    wazuh_agents:
      hosts:
        client-01:
          ansible_host: 192.168.56.11
          ansible_user: vagrant
          ansible_ssh_private_key_file: ../../.vagrant/machines/client/virtualbox/private_key

    caldera_server:
      hosts:
        caldera-01:
          ansible_host: 192.168.56.12
          ansible_user: vagrant
          ansible_ssh_private_key_file: ../../.vagrant/machines/caldera/virtualbox/private_key

    elastic_server:
      hosts:
        elastic-01:
          ansible_host: 192.168.56.13
          ansible_user: vagrant
          ansible_ssh_private_key_file: ../../.vagrant/machines/elastic/virtualbox/private_key

    # client-01 (déjà défini dans wazuh_agents) est réutilisé comme hôte
    # Elastic Agent ; ses variables de connexion sont héritées de sa
    # première définition.
    elastic_agents:
      hosts:
        client-01: {}
